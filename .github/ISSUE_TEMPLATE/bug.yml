name: Bug report
description: Something does not work as described.
labels: [bug]
body:
    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you did, what you expected, and what happened instead.
      validations:
          required: true
    - type: input
      id: where
      attributes:
          label: Page and browser
          description: For example "/fingerstavning, Firefox 140, NVDA 2026.1".
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
