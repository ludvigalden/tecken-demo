name: Security

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: security-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash --noprofile --norc -euo pipefail {0}

jobs:
    visibility:
        runs-on: ubuntu-latest
        outputs:
            public: ${{ steps.vis.outputs.public }}
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
            - id: vis
              run: |
                  VIS=$(gh api "repos/${{ github.repository }}" --jq .visibility)
                  echo "public=$( [ "$VIS" = "public" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            - name: Job duration
              if: always()
              run: |
                  echo "visibility: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
        env:
            GH_TOKEN: ${{ github.token }}

    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm audit --audit-level=high
            - name: Job duration
              if: always()
              run: |
                  echo "audit: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    dependency-review:
        needs: visibility
        if: github.event_name == 'pull_request' && needs.visibility.outputs.public == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              # v5.0.0
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
            - name: Job duration
              if: always()
              run: |
                  echo "dependency-review: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    dependency-review-elided:
        needs: visibility
        if: github.event_name == 'pull_request' && needs.visibility.outputs.public != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Loud elision
              run: |
                  echo "ELIDED: dependency-review needs a public repo or GHAS" >> "$GITHUB_STEP_SUMMARY"
