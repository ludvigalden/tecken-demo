name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash --noprofile --norc -euo pipefail {0}

jobs:
    static:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx lerna run typecheck
            - run: npx lerna run lint
            - name: Lint root scripts and tests outside the workspaces
              run: npm run lint:repo
            - name: Tree hygiene guard catches planted traces (negative control)
              run: node tools/ci/check-tree-hygiene.mjs --self-test
            - name: No retired contact address or build trace in the tree
              run: node tools/ci/check-tree-hygiene.mjs
            - name: README coverage line matches content/
              run: node tools/ci/check-coverage-stamp.mjs
            - name: content/ file counts match the media manifest
              run: node tools/ci/check-media-count.mjs
            - name: publiccode.yml validates (publiccode-parser v5.4.3)
              run: |
                  # The runner image's preinstalled Go builds the parser; a
                  # missing toolchain fails the step (no silent skip).
                  go install github.com/italia/publiccode-parser-go/v5/publiccode-parser@v5.4.3
                  # -no-network: the parser checks the file itself and fetches
                  # nothing, so the check does not depend on the network.
                  "$(go env GOPATH)/bin/publiccode-parser" -no-network -path . publiccode.yml
            - run: npx prettier --check .
            - name: stylelint
              run: npx stylelint "**/*.{css,scss,vue}" --allow-empty-input
            - name: html-validate (tracked sources only)
              run: |
                  FILES="$(git ls-files '*.vue' '*.html')"
                  # An empty list would pass without checking anything.
                  test -n "$FILES" || { echo "no .vue/.html sources tracked" >&2; exit 1; }
                  # shellcheck disable=SC2086
                  npx html-validate $FILES
            - run: npx markdownlint-cli2
            - name: commitlint
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      FROM="${{ github.event.pull_request.base.sha }}"
                  elif [ -n "${{ github.event.before }}" ] && \
                          [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                      FROM="${{ github.event.before }}"
                  else
                      FROM="$(git rev-list --max-parents=0 HEAD | head -1)"
                      echo "root commit $FROM checked explicitly (no valid before-sha)"
                      git log --format=%B -n 1 "$FROM" | npx commitlint || exit 1
                  fi
                  npx commitlint --from "$FROM" --to HEAD
            - name: reuse lint
              run: pipx run reuse==6.2.0 lint
            - name: Install Terraform 1.16.4 (checksum-pinned)
              run: |
                  ZIP=terraform_1.16.4_linux_amd64.zip
                  curl -sSfLo "$RUNNER_TEMP/$ZIP" "https://releases.hashicorp.com/terraform/1.16.4/$ZIP"
                  echo "dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df  $RUNNER_TEMP/$ZIP" \
                      | sha256sum -c -
                  unzip -q -o "$RUNNER_TEMP/$ZIP" -d "$RUNNER_TEMP/terraform"
                  echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"
            - name: terraform checks
              run: |
                  terraform version
                  terraform fmt -check -recursive
                  for root in infra/terraform/*/; do
                      (cd "$root" && terraform init -backend=false -lockfile=readonly >/dev/null && terraform validate)
                  done
            - name: hadolint
              run: docker run --rm -i hadolint/hadolint < Dockerfile
            - name: Job duration
              if: always()
              run: |
                  echo "static: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    unit:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Require ffprobe (media integrity test; fail closed)
              run: |
                  if ! command -v ffprobe > /dev/null; then
                      sudo apt-get update -qq
                      sudo apt-get install -y -qq ffmpeg
                  fi
                  ffprobe -version | head -1
            - run: npx lerna run test
            - name: Job duration
              if: always()
              run: |
                  echo "unit: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    drift:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Regenerate generated artifacts and fail on drift
              run: |
                  npx lerna run generate || { echo "generate failed" >&2; exit 1; }
                  if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
                      echo "drift: clean"
                  else
                      git status --porcelain
                      echo "drift: working tree changed after generate" >&2
                      exit 1
                  fi
            - name: Job duration
              if: always()
              run: |
                  echo "drift: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    release-dry-run:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx lerna run build
            - name: Lerna version (throwaway checkout, no tags, no push)
              run: npx lerna version --no-git-tag-version --no-push --yes 0.1.0
            - name: npm pack dry-run with allowlist check
              run: node tools/ci/check-pack.mjs packages/contracts packages/design-system
            - name: Job duration
              if: always()
              run: |
                  echo "release-dry-run: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    browser:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx lerna run build
            - name: Install Playwright browsers (all declared; none may be skipped)
              run: npx playwright install --with-deps chromium firefox webkit
            - name: Bundle the Node server (the suite runs against it)
              run: npm run bundle --workspace services/api
            - name: App journeys + design system, axe and CSP, over local TLS
              run: |
                  TLSDIR="$(tests/tls/make-cert.sh)"
                  cd tests
                  TLS_CERT_FILE="$TLSDIR/cert.pem" TLS_KEY_FILE="$TLSDIR/key.pem" PORT=8443 \
                      PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/playwright-report.json" \
                      npx playwright test -c playwright.config.mjs --reporter=list,json
            - name: Every declared browser ran every declared test
              if: always()
              run: |
                  (cd tests && npx playwright test -c playwright.config.mjs --list --reporter=json) \
                      > playwright-list.json
                  node tools/ci/check-browsers.mjs playwright-report.json playwright-list.json
            - name: Job duration
              if: always()
              run: |
                  echo "browser: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    perf:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx lerna run build
            - name: Size budgets (gzip, baseline + 10 %)
              run: npx size-limit
            - name: Install Chromium for Lighthouse
              run: npx playwright install --with-deps chromium
            - name: Bundle the Node server
              run: npm run bundle --workspace services/api
            - name: Lighthouse CI (3 runs, median) against the Node server over local TLS
              run: |
                  TLSDIR="$(tests/tls/make-cert.sh)"
                  CHROME_PATH="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
                  export CHROME_PATH
                  TECKEN_ROOT=. HOST=127.0.0.1 PORT=8443 \
                      TLS_CERT_FILE="$TLSDIR/cert.pem" TLS_KEY_FILE="$TLSDIR/key.pem" \
                      node services/api/dist/server.mjs &
                  SERVER=$!
                  for _ in $(seq 1 30); do
                      curl -skf https://127.0.0.1:8443/v1/health > /dev/null && break
                      sleep 1
                  done
                  curl -skf https://127.0.0.1:8443/v1/health > /dev/null
                  RC=0
                  npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json || RC=$?
                  npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json || RC=$?
                  # Error-level ceilings over the two warn-only mobile elisions,
                  # asserted on the same mobile reports.
                  npx --yes @lhci/cli@0.15.1 assert --config=lighthouserc.mobile-ceiling.json || RC=$?
                  kill "$SERVER"
                  exit "$RC"
            - name: Job duration
              if: always()
              run: |
                  echo "perf: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"

    image:
        runs-on: ubuntu-latest
        steps:
            - name: Record start
              run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
              # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              # v7.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Build the production image (no push)
              run: |
                  docker build -t tecken:ci .
                  docker image inspect tecken:ci --format 'image size: {{.Size}} bytes' \
                      | tee -a "$GITHUB_STEP_SUMMARY"
            # The test tooling runs on the runner; the server under test is
            # the container, exactly as it ships.
            - run: npm ci
            # The suite reads Storybook's story index and the design-system
            # CSS from the runner's tree; the container serves the same build.
            - name: Build the workspaces the suite reads
              run: npx lerna run build
            - name: Install Playwright browsers (all declared; none may be skipped)
              run: npx playwright install --with-deps chromium firefox webkit
            - name: Full browser suite against the container over local TLS
              run: |
                  TLSDIR="$(tests/tls/make-cert.sh)"
                  # The container runs as uid 1000; let it read the throwaway cert.
                  chmod a+rx "$TLSDIR"
                  chmod a+r "$TLSDIR"/*.pem
                  START_MS=$(date +%s%3N)
                  docker run -d --name tecken-tls -p 8443:8443 \
                      -v "$TLSDIR:/tls:ro" \
                      -v "$PWD/packages/design-system/examples:/app/packages/design-system/examples:ro" \
                      -v "$PWD/packages/design-system/dist:/app/packages/design-system/dist:ro" \
                      -e TLS_CERT_FILE=/tls/cert.pem -e TLS_KEY_FILE=/tls/key.pem \
                      -e PORT=8443 -e TECKEN_EXAMPLES=1 tecken:ci
                  for _ in $(seq 1 300); do
                      curl -skf -o /dev/null https://127.0.0.1:8443/v1/health && break
                      sleep 0.1
                  done
                  curl -skf -o /dev/null https://127.0.0.1:8443/v1/health
                  echo "docker run to first 200: $(( $(date +%s%3N) - START_MS )) ms" \
                      | tee -a "$GITHUB_STEP_SUMMARY"
                  cd tests
                  TECKEN_EXTERNAL_SERVER=1 PORT=8443 \
                      PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/image-report.json" \
                      npx playwright test -c playwright.config.mjs --reporter=list,json
            - name: Every declared browser ran every declared test
              if: always()
              run: |
                  (cd tests && npx playwright test -c playwright.config.mjs --list --reporter=json) \
                      > image-list.json
                  node tools/ci/check-browsers.mjs image-report.json image-list.json
            - name: Production mode (plain http) starts and sends identical headers
              run: |
                  docker run -d --name tecken-http -p 8080:8080 tecken:ci
                  for _ in $(seq 1 300); do
                      curl -sf -o /dev/null http://127.0.0.1:8080/v1/health && break
                      sleep 0.1
                  done
                  curl -sf -o /dev/null -D http.txt http://127.0.0.1:8080/
                  curl -skf -o /dev/null -D tls.txt https://127.0.0.1:8443/
                  for f in http tls; do
                      grep -i -v -E '^(date|connection|keep-alive|last-modified|content-length):' "$f.txt" \
                          | tr -d '\r' | sort > "$f.sorted"
                  done
                  diff tls.sorted http.sorted
                  grep -i '^content-security-policy:' http.txt
            - name: Container logs
              if: always()
              run: |
                  docker logs tecken-tls || true
                  docker logs tecken-http || true
            - name: Job duration
              if: always()
              run: |
                  echo "image: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
