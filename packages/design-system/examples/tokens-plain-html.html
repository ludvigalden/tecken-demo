<!doctype html>
<html lang="sv">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Tecken-tokens utan Vue</title>
        <link rel="stylesheet" href="/ds/tokens.css" />
        <link rel="stylesheet" href="/examples/tokens-plain-html.css" />
    </head>
    <body>
        <main>
            <h1>Tecken-tokens utan Vue</h1>
            <p>
                Den här sidan använder bara den genererade
                <code>tokens.css</code>. Ingen Vue, inget FKUI, inget skript.
            </p>
            <section aria-labelledby="statuses">
                <h2 id="statuses">Statusroller</h2>
                <ul class="statuses">
                    <li class="status status--recorded">Inspelad källa</li>
                    <li class="status status--link-out">Länk till källa</li>
                    <li class="status status--unsupported">Ingen inspelning</li>
                </ul>
            </section>
            <p><a class="action" href="#statuses">Till statusrollerna</a></p>
        </main>
    </body>
</html>
