version = 1

# Code and configuration are MIT. Generated and licensed media under
# content/ carry their own REUSE.toml files with per-file annotations.
[[annotations]]
path = [
    "*",
    ".*",
    ".github/**",
    "apps/**",
    "docs/**",
    "packages/**",
    "services/**",
    "tools/**",
    "tests/**",
    "contracts/**",
]
SPDX-FileCopyrightText = "2026 Ludvig Aldén"
SPDX-License-Identifier = "MIT"

# The code of conduct is the Contributor Covenant 2.1, reused as its
# authors intend (adopt it and fill in the contact line). Its licence terms
# are recorded in LICENSES/LicenseRef-Contributor-Covenant.txt.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors"
SPDX-License-Identifier = "LicenseRef-Contributor-Covenant"
