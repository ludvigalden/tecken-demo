description:
    sv:
        shortDescription: >-
            En demonstration av webbutveckling som spelar upp inspelat svenskt
            teckenspråk för ett fåtal vardagliga fraser.
        longDescription: >
            Tecken är en demonstration av webbutveckling: tillgänglighet,
            testning, arkitektur och arbete med öppen källkod. Den spelar upp
            inspelat svenskt teckenspråk för ett fåtal vardagliga fraser och
            handalfabetet, med svensk textning och med källa och licens för
            varje klipp. Alla inspelningar kommer från Wikimedia Commons.


            Tecken konkurrerar inte med någon tjänst. Den verkliga och långt
            mer fullständiga resursen är Svenskt teckenspråkslexikon
            (https://teckensprakslexikon.su.se/), som Tecken länkar till.
            Tecken översätter ingenting, genererar ingenting och ersätter
            ingen teckenspråkstolk.
        features:
            - Uppspelning av inspelat teckenspråk med svensk textning
            - Källa, upphov och licens för varje klipp
            - Förslag på stött yttrande med bekräftelse, aldrig vid negation
            - Fingerstavning bokstav för bokstav med det svenska handalfabetet
            - Länkar till Svenskt teckenspråkslexikon för ord som inte stöds
    en:
        shortDescription: >-
            A demonstration of web-platform engineering that plays recorded
            Swedish Sign Language for a handful of everyday phrases.
        longDescription: >
            Tecken is a demonstration of web-platform engineering:
            accessibility, testing, architecture and open-source practice. It
            plays recorded Swedish Sign Language for a handful of everyday
            phrases and the manual alphabet, with Swedish captions and the
            source and licence of every clip. All recordings come from
            Wikimedia Commons.


            Tecken does not compete with any service. The real and far more
            complete resource is the Swedish Sign Language Dictionary
            (https://teckensprakslexikon.su.se/), which Tecken links to.
            Tecken translates nothing, generates nothing and replaces no sign
            language interpreter.
        features:
            - Playback of recorded signing with Swedish captions
            - Source, author and licence of every clip
            - Suggested supported utterance with confirmation, never when the phrase is negated
            - Fingerspelling letter by letter with the Swedish manual alphabet
            - Links to the Swedish Sign Language Dictionary for unsupported words

